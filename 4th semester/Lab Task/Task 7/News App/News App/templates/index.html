<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live News Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4">📰 Daily News Feed</h1>
    
    <div class="card p-4 mb-5 shadow-sm">
        <h4 class="mb-3">Post a News Update</h4>
        <form id="newsForm">
            <div class="mb-3">
                <input type="text" id="title" class="form-control" placeholder="News Headline (Required)" required>
            </div>
            <div class="mb-3">
                <textarea id="description" class="form-control" placeholder="Short Description" rows="2"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" id="source" class="form-control" placeholder="Source Name (e.g., BBC, CNN)">
                </div>
                <div class="col-md-6 mb-3">
                    <input type="url" id="url" class="form-control" placeholder="Read More URL (optional)">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Publish News</button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Latest Headlines</h3>
        <button onclick="loadNews()" class="btn btn-outline-secondary btn-sm">Refresh Feed</button>
    </div>
    
    <div id="news-container" class="row g-4">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
