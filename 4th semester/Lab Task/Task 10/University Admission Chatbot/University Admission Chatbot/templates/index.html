<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>University Admission Chatbot</title>
		<link rel="stylesheet" href="/static/style.css" />
	</head>
	<body>
		<main class="chat-app">
			<header class="chat-header">
				<h1>University Admission Chatbot</h1>
				<p>Ask about deadlines, requirements, scholarships and more.</p>
			</header>

			<section id="chat-window" class="chat-window" aria-live="polite"></section>

			<form id="chat-form" class="chat-form">
				<input id="message-input" type="text" placeholder="Type your question..." autocomplete="off" />
				<button type="submit">Send</button>
			</form>
		</main>

		<script src="/static/script.js"></script>
	</body>
</html>
